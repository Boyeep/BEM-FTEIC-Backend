name: Deploy Backend Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: backend-production-group1
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bem_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bem_test?sslmode=disable
        run: |
          go test ./...
          go test -tags=integration ./database

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package source
        run: |
          tar \
            --exclude=.git \
            --exclude=.env \
            --exclude=uploads \
            -czf "$RUNNER_TEMP/backend-source.tar.gz" .
          mv "$RUNNER_TEMP/backend-source.tar.gz" backend-source.tar.gz

      - name: Upload source to VPS
        id: upload
        continue-on-error: true
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: backend-source.tar.gz
          target: /tmp

      - name: Retry source upload
        if: steps.upload.outcome == 'failure'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: backend-source.tar.gz
          target: /tmp

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -eu

            APP_DIR="$HOME/backend"
            ARCHIVE="/tmp/backend-source.tar.gz"

            mkdir -p "$APP_DIR"
            tar -xzf "$ARCHIVE" -C "$APP_DIR"
            rm -f "$ARCHIVE"

            cd "$APP_DIR"

            if [ ! -f .env ]; then
              echo "Missing $APP_DIR/.env"
              exit 1
            fi

            RELEASE_TAG="${{ github.sha }}"
            PREVIOUS_TAG="$(cat .last-successful-image 2>/dev/null || echo latest)"
            mkdir -p backups
            select_tag() {
              printf 'BACKEND_IMAGE_TAG=%s\n' "$1" > .deploy.env
            }

            select_tag "$RELEASE_TAG"
            sudo docker compose -p group1 --env-file .deploy.env config --quiet

            echo "Backing up upload volume..."
            select_tag "$PREVIOUS_TAG"
            sudo docker compose -p group1 --env-file .deploy.env run --rm --user root \
              backend sh -c 'tar -czf "/backups/uploads-$(date -u +%Y%m%dT%H%M%SZ).tar.gz" -C /app/uploads .'
            find "$APP_DIR/backups" -type f -name 'uploads-*.tar.gz' -mtime +14 -delete

            select_tag "$RELEASE_TAG"
            sudo docker compose -p group1 --env-file .deploy.env build backend

            echo "Running database migrations..."
            if ! sudo docker compose -p group1 --env-file .deploy.env run --rm backend /app/server --migrate; then
              echo "Migration failed; current release remains active."
              exit 1
            fi

            sudo docker compose -p group1 --env-file .deploy.env up -d backend

            if ! curl --retry 15 --retry-delay 3 --retry-connrefused --retry-all-errors \
              --fail --silent --show-error http://127.0.0.1:8002/ready; then
              echo "Readiness failed; rolling back to $PREVIOUS_TAG..."
              select_tag "$PREVIOUS_TAG"
              sudo docker compose -p group1 --env-file .deploy.env up -d backend
              curl --retry 10 --retry-delay 3 --retry-connrefused --retry-all-errors \
                --fail --silent --show-error http://127.0.0.1:8002/ready
              exit 1
            fi

            printf '%s\n' "$RELEASE_TAG" > .last-successful-image
            select_tag "$RELEASE_TAG"
            sudo docker compose -p group1 --env-file .deploy.env ps backend
