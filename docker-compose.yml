services:
  backend:
    image: group1-backend:${BACKEND_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 8080
    ports:
      - "8002:8080"
    volumes:
      - backend_uploads:/app/uploads
      - ./backups:/backups
    restart: unless-stopped

volumes:
  backend_uploads:
